<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Loading…</title>

<script>
  var ts = Date.now();

    document.body.innerHTML = '<pre style="color:red;padding:20px;font-family:monospace;background:black;position:fixed;inset:0;overflow:auto;z-index:99999;font-size:14px">' + (e.error ? e.error.stack : e.message) + '\n\nFile: ' + e.filename + '\nLine: ' + e.lineno + '</pre>';
  });
  document.write('<scr'+'ipt type="module" src="/js/app.js?v=' + ts + '"></scr'+'ipt>');
</script>
</head><body><main id="app"></main></body></html>
