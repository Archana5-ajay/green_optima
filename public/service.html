<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Service — Loading…</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&family=Red+Hat+Mono:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/site.css">
  <link rel="stylesheet" href="/css/sections.css">
  <style>
    .svc-detail{min-height:100vh;background:var(--cream);padding:140px var(--pad) 100px}
    .svc-detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:80px;align-items:start;max-width:1340px;margin:auto}
    .svc-detail-img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:28px;display:block;box-shadow:0 24px 60px rgba(0,0,0,.14)}
    .svc-detail-img.ph{min-height:400px;border-radius:28px}
    .svc-detail-left .pl-i{width:72px;height:72px;margin-bottom:28px}
    .svc-detail-left h1{font:600 52px/58px Inter;letter-spacing:-2.5px;margin-bottom:20px}
    .svc-detail-left p{opacity:.75;max-width:540px;margin-bottom:36px;line-height:1.7}
    .svc-subs-detail{list-style:none;display:grid;gap:12px;margin-bottom:44px}
    .svc-subs-detail li{display:flex;align-items:center;gap:14px;padding:14px 18px;background:rgba(0,0,0,.04);border-radius:14px;font-weight:500}
    .svc-subs-detail li b{font:700 12px 'Red Hat Mono';color:var(--accent);min-width:26px}
    .back-btn{display:inline-flex;align-items:center;gap:8px;font-weight:600;color:var(--ink);margin-bottom:50px;opacity:.6;transition:opacity .2s}
    .back-btn:hover{opacity:1}
    @media(max-width:1024px){.svc-detail-grid{grid-template-columns:1fr;gap:40px}.svc-detail-left h1{font-size:36px;line-height:42px}}
  </style>
</head>
<body>
<div id="svc-page">
  <div class="svc-detail">
    <div class="svc-detail-grid">
      <div class="svc-detail-left" id="svc-info">
        <a href="/#services" class="back-btn" id="back">← Back to Services</a>
        <p id="svc-loading" style="opacity:.5">Loading…</p>
      </div>
      <div id="svc-img-col"></div>
    </div>
  </div>
</div>
<script type="module">
  import { iconOrImg, h } from '/js/lib/dom.js';

  const safe = u => (typeof u === 'string' && /^(\/uploads\/|https?:\/\/)/.test(u) ? u : '');

  const slug = location.pathname.replace(/\/service\/?/, '').replace(/\/$/, '');
  const decoded = decodeURIComponent(slug);

  const c = await fetch('/api/content').then(r => r.json());

  // Apply theme
  for (const [k, v] of Object.entries(c.theme || {})) {
    if (/^#[0-9a-f]{3,8}$/i.test(v)) document.documentElement.style.setProperty('--' + k, v);
  }

  const service = c.services?.items?.find(s => {
    const s_slug = (s.title || '').toLowerCase().replace(/\s+/g, '-');
    return s_slug === decoded;
  });

  const infoCol = document.getElementById('svc-info');
  const imgCol = document.getElementById('svc-img-col');
  document.getElementById('svc-loading')?.remove();

  if (!service) {
    infoCol.append(
      h('h1', {}, 'Service not found'),
      h('p', {}, 'Could not find service: ' + decoded),
      h('a', { href: '/#services', class: 'btn', style: 'margin-top:24px' }, 'Back to Services')
    );
  } else {
    document.title = service.title + ' — ' + (c.site?.name || 'Green Optima');

    const iconEl = h('span', { class: 'pl-i', style: 'width:72px;height:72px;margin-bottom:28px;display:inline-flex' }, iconOrImg(service.icon));
    const tag = h('span', { class: 'tag', style: 'margin-bottom:18px' }, c.services?.tag || 'Our Services');
    const title = h('h1', {}, service.title);
    const text = h('p', { style: 'opacity:.75;max-width:540px;margin-bottom:36px;line-height:1.7' }, service.text);

    const subs = service.subs?.length
      ? h('ol', { class: 'svc-subs-detail' },
          ...service.subs.map((sub, n) =>
            h('li', {},
              h('b', {}, String(n + 1).padStart(2, '0')),
              sub
            )
          )
        )
      : null;

    const ctaBtn = h('a', {
      href: '/#contact',
      class: 'btn',
      style: 'display:inline-flex'
    }, 'Get in Touch');

    infoCol.append(
      h('a', { href: '/#services', class: 'back-btn' }, '← All Services'),
      tag, iconEl, title, text,
      subs,
      ctaBtn
    );

    // Right image column
    if (safe(service.image)) {
      imgCol.append(h('img', {
        src: service.image,
        alt: service.title,
        class: 'svc-detail-img'
      }));
    } else {
      imgCol.append(h('div', { class: 'ph svc-detail-img' }, '[ SERVICE IMAGE ]'));
    }
  }
</script>
</body>
</html>
